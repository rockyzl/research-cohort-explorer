[project]
name = "research-cohort-explorer"
version = "0.1.0"
description = "Catalog-driven cohort explorer over public TCGA-BRCA data with validated LLM text-to-SQL"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2,<3",
  "openpyxl>=3.1,<4",
  "pyyaml>=6,<7",
  "sqlglot>=25,<28",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "openai>=1.50,<2",
  "httpx>=0.27,<1",
  "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cohort"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
